name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDL 3.4.18
        run: git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git ../SDL3

      - name: Set up the MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DSDL3_SOURCE_DIR=../SDL3

      - name: Build
        run: cmake --build build

      - name: Check the client was built
        shell: pwsh
        run: |
          if (-not (Test-Path build/client/ta_play.exe)) {
            Write-Output "build/client/ta_play.exe is missing. Executables the build made:"
            Get-ChildItem -Recurse -Filter *.exe build | ForEach-Object { $_.FullName }
            Write-Output "Configure summary:"
            Select-String -Path build/CMakeCache.txt -Pattern "SDL3_SOURCE_DIR|CMAKE_BUILD_TYPE|CMAKE_CXX_COMPILER:"
            exit 1
          }

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload the client
        uses: actions/upload-artifact@v4
        with:
          name: ta_play-windows-x64
          path: build/client/ta_play.exe
          if-no-files-found: error
